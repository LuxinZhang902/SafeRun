<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Threat Panel · Final</title>
<style>
:root{--bg:#0b0f1a;--panel:#0f172a;--card:#111827;--text:#e6f0ff;--muted:#9bb0c9;--line:#1f2a40;--accent:#6ee7b7;}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0b0f1a,#090d16);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:1200px;margin:24px auto;padding:0 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:700;font-size:20px}
.segment{display:flex;gap:8px;background:#0a1222;border:1px solid var(--line);border-radius:999px;padding:4px}
.segment button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer}
.segment button.active{background:#1a2540;color:var(--text)}
.grid{display:grid;grid-template-columns: 360px 1fr; gap:16px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:620px;display:flex;flex-direction:column}
.card h3{margin:0 0 10px 0;font-size:14px;color:var(--muted);font-weight:600}
.slot{flex:1;border:1px dashed #21324d;border-radius:12px;background:#0c1422;display:flex;align-items:center;justify-content:center;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;margin-top:8px}
label{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#0a1325;font-size:12px}
.footer{font-size:12px;color:var(--muted);margin-top:10px}
.range{width:100%}
.val{min-width:44px;text-align:right}
</style>
<script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">Threat Panel · Final</div>
    <div class="segment" id="species">
      <button data-s="cat" class="active">🐱 Cat</button>
      <button data-s="dog">🐶 Dog</button>
    </div>
  </div>
  <div class="grid">
    <aside class="side">
      <div class="badge">Spec: 512×512 · 24fps · Lottie</div>
      <div class="row"><label for="level">Threat Level (0–100)</label><span class="val" id="val">0</span></div>
      <input id="level" class="range" type="range" min="0" max="100" step="1" value="0">
      <div class="footer">
        Mapping: 0–10 <b>Office Thumbs-up</b>, 11–40 <b>Office Idle</b>, 41–70 <b>Medieval Idle</b>, 71–90 <b>Cyber Angry</b>, 91–100 <b>Cyber Very Angry</b>.
      </div>
    </aside>
    <section class="card">
      <h3 id="title">Cat · Office · Thumbs-up</h3>
      <div id="slot" class="slot"></div>
      <div id="note" class="footer"></div>
    </section>
  </div>
</div>
<script>
const manifest = {"ranges": [{"min": 0, "max": 10, "state": "excellent", "cat": "office_cat_celebrate.json", "dog": "office_dog_celebrate.json"}, {"min": 11, "max": 40, "state": "fine", "cat": "office_cat_idle.json", "dog": "office_dog_idle.json"}, {"min": 41, "max": 70, "state": "critical", "cat": "medieval_cat_idle.json", "dog": "medieval_dog_idle.json"}, {"min": 71, "max": 90, "state": "bad", "cat": "cyber_cat_angry.json", "dog": "cyber_dog_angry.json"}, {"min": 91, "max": 100, "state": "very_bad", "cat": "cyber_cat_veryangry.json", "dog": "cyber_dog_veryangry.json"}]};
const base='lottie/';
function stateFor(level){ return manifest.ranges.find(r=>level>=r.min && level<=r.max); }
let currentSpecies='cat', anim=null;
const slot=document.getElementById('slot');
const note=document.getElementById('note');
const title=document.getElementById('title');

function load(path){
  slot.innerHTML='';
  note.textContent='';
  if(anim){ try{anim.destroy();}catch(e){} }
  anim = lottie.loadAnimation({container:slot,renderer:'svg',loop:true,autoplay:true,path:base+path});
}
function render(level){
  const r = stateFor(level);
  document.getElementById('val').textContent = level;
  const labelSpecies = currentSpecies==='cat'?'Cat':'Dog';
  const humanState = {excellent:'Office · Thumbs-up', fine:'Office · Idle', critical:'Medieval · Idle', bad:'Cyber · Angry', very_bad:'Cyber · Very Angry'}[r.state];
  title.textContent = labelSpecies+' · '+humanState;
  const file = r[currentSpecies];
  fetch(base+file, {method:'HEAD'}).then(resp=>{
    if(resp.ok){ load(file); }
    else { slot.innerHTML = '<div class="footer">Missing: '+file+' — add medieval JSONs to complete the set.</div>'; }
  }).catch(()=>{ slot.innerHTML = '<div class="footer">Missing: '+file+' — add medieval JSONs to complete the set.</div>'; });
}
document.getElementById('species').addEventListener('click', (e)=>{
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentSpecies = e.target.dataset.s;
  render(parseInt(document.getElementById('level').value,10));
});
document.getElementById('level').addEventListener('input', (e)=> render(parseInt(e.target.value,10)));
render(0);
</script>
</body>
</html>
