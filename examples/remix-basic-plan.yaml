version: "1.0"
name: remix-basic-example
runtime: node:20

steps:
  - name: Install dependencies
    verb: install
    timeout: 300000  # 5 minutes

  - name: Build application
    verb: build
    timeout: 600000  # 10 minutes
    env:
      NODE_ENV: production

  - name: Run application
    verb: run
    env:
      PORT: "3000"

ports:
  - 3000

healthcheck: /
